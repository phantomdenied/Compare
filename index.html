<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTG Collection Comparator</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0f;
    --surface: #11141c;
    --surface2: #181c28;
    --border: #2a2f45;
    --gold: #c9a84c;
    --gold2: #e8c97a;
    --blue: #4a7fc1;
    --red: #c14a4a;
    --green: #4a9c6f;
    --text: #d4cfc4;
    --muted: #6b7080;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 16px;
    min-height: 100vh;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(74,127,193,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(201,168,76,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 24px 60px; }

  header {
    text-align: center;
    padding: 48px 0 36px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 36px;
  }

  header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.04em;
    line-height: 1.1;
  }

  header p {
    color: var(--muted);
    margin-top: 8px;
    font-size: 15px;
    font-style: italic;
  }

  /* Upload zone */
  .upload-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 28px;
  }

  @media (max-width: 640px) { .upload-grid { grid-template-columns: 1fr; } }

  .upload-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    position: relative;
  }

  .upload-box label {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--gold);
    text-transform: uppercase;
    display: block;
    margin-bottom: 12px;
  }

  .drop-zone {
    border: 1.5px dashed var(--border);
    border-radius: 6px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--gold);
    background: rgba(201,168,76,0.04);
  }

  .drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-zone .icon { font-size: 28px; margin-bottom: 8px; }
  .drop-zone .hint { color: var(--muted); font-size: 13px; }
  .drop-zone .filename { color: var(--gold2); font-size: 14px; margin-top: 6px; font-style: italic; }

  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Crimson Pro', monospace;
    font-size: 14px;
    padding: 12px;
    resize: vertical;
    min-height: 140px;
    transition: border-color 0.2s;
  }
  textarea:focus { outline: none; border-color: var(--gold); }
  textarea::placeholder { color: var(--muted); }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #8b6914, var(--gold), #8b6914);
    background-size: 200% 100%;
    border: none;
    border-radius: var(--radius);
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: #0a0b0f;
    cursor: pointer;
    transition: background-position 0.4s, transform 0.1s;
    margin-bottom: 28px;
  }
  .btn:hover { background-position: 100% 0; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Stats bar */
  .stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  .stat {
    flex: 1;
    min-width: 120px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    text-align: center;
  }

  .stat .num {
    font-family: 'Cinzel', serif;
    font-size: 32px;
    font-weight: 900;
    line-height: 1;
  }

  .stat .lbl {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 4px;
  }

  .stat.s-deck .num { color: var(--blue); }
  .stat.s-binder .num { color: var(--green); }
  .stat.s-missing .num { color: var(--red); }
  .stat.s-total .num { color: var(--gold); }

  /* Section */
  .section {
    margin-bottom: 40px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .section-header h2 {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }

  .badge {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.06em;
  }

  .badge-deck { background: rgba(74,127,193,0.2); color: var(--blue); border: 1px solid rgba(74,127,193,0.3); }
  .badge-binder { background: rgba(74,156,111,0.2); color: var(--green); border: 1px solid rgba(74,156,111,0.3); }
  .badge-missing { background: rgba(193,74,74,0.2); color: var(--red); border: 1px solid rgba(193,74,74,0.3); }

  /* Card grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  .mtg-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    cursor: default;
  }

  .mtg-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    border-color: var(--gold);
  }

  .mtg-card .img-wrap {
    width: 100%;
    aspect-ratio: 63/88;
    background: var(--surface2);
    position: relative;
    overflow: hidden;
  }

  .mtg-card .img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.3s;
  }

  .mtg-card .img-wrap .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    padding: 8px;
  }

  .mtg-card .img-wrap .placeholder .symbol { font-size: 28px; }

  .mtg-card .card-info {
    padding: 10px 10px 12px;
  }

  .mtg-card .card-name {
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 6px;
  }

  .mtg-card .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.04em;
    font-family: 'Cinzel', serif;
  }

  .tag-deck { background: rgba(74,127,193,0.25); color: #7aaee8; }
  .tag-binder { background: rgba(74,156,111,0.25); color: #7acc9f; }

  /* Missing list */
  .missing-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }

  .missing-item {
    background: var(--surface);
    border: 1px solid rgba(193,74,74,0.2);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    color: #c47c7c;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .missing-item::before {
    content: '✕';
    font-size: 11px;
    color: var(--red);
    flex-shrink: 0;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-style: italic;
  }

  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 10px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #results { visibility: hidden; min-height: 0; }

  .empty { color: var(--muted); font-style: italic; padding: 20px 0; }

  /* Scryfall credit */
  .credit {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 40px;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Collection Comparator</h1>
    <p>Upload your ManaBox export and paste your wishlist to find what you have</p>
  </header>

  <div class="upload-grid">
    <div class="upload-box">
      <label>Your ManaBox Collection (CSV)</label>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="csvFile" accept=".csv,.txt">
        <div class="icon">📦</div>
        <div class="hint">Click or drag your CSV here</div>
        <div class="filename" id="csvFilename"></div>
      </div>
    </div>

    <div class="upload-box">
      <label>Target Card List</label>
      <textarea id="targetList" placeholder="Paste your list here — e.g.
1 Atemsis, All-Seeing (M20) 46
1 Aetherize (LCC) 142
1 Arcanis the Omnipotent (DMR) 280
..."></textarea>
    </div>
  </div>

  <button class="btn" id="compareBtn">⚔ Compare Collection</button>

  <div id="results">
    <div class="stats">
      <div class="stat s-total">
        <div class="num" id="statTotal">0</div>
        <div class="lbl">Cards Searched</div>
      </div>
      <div class="stat s-deck">
        <div class="num" id="statDeck">0</div>
        <div class="lbl">In Decks</div>
      </div>
      <div class="stat s-binder">
        <div class="num" id="statBinder">0</div>
        <div class="lbl">In Binders</div>
      </div>
      <div class="stat s-missing">
        <div class="num" id="statMissing">0</div>
        <div class="lbl">Missing</div>
      </div>
    </div>

    <!-- In Decks -->
    <div class="section" id="deckSection">
      <div class="section-header">
        <h2>In Decks</h2>
        <span class="badge badge-deck" id="deckBadge">0</span>
      </div>
      <div class="card-grid" id="deckGrid"></div>
    </div>

    <!-- In Binders/Boxes -->
    <div class="section" id="binderSection">
      <div class="section-header">
        <h2>In Binders &amp; Boxes</h2>
        <span class="badge badge-binder" id="binderBadge">0</span>
      </div>
      <div class="card-grid" id="binderGrid"></div>
    </div>

    <!-- Missing -->
    <div class="section" id="missingSection">
      <div class="section-header">
        <h2>Missing</h2>
        <span class="badge badge-missing" id="missingBadge">0</span>
      </div>
      <div class="missing-grid" id="missingGrid"></div>
    </div>

    <div class="credit">Card images provided by <a href="https://scryfall.com" style="color:var(--gold);text-decoration:none;">Scryfall</a></div>
  </div>
</div>

<script>
let collectionData = [];

// --- CSV Upload ---
document.getElementById('csvFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('csvFilename').textContent = file.name;
  const reader = new FileReader();
  reader.onload = (ev) => {
    collectionData = parseCSV(ev.target.result);
    console.log(`Loaded ${collectionData.length} collection rows`);
  };
  reader.readAsText(file);
});

// Drag and drop
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) {
    document.getElementById('csvFilename').textContent = file.name;
    const reader = new FileReader();
    reader.onload = (ev) => {
      collectionData = parseCSV(ev.target.result);
    };
    reader.readAsText(file);
  }
});

// --- CSV Parser ---
function parseCSV(text) {
  const lines = text.split('\n');
  if (lines.length < 2) return [];

  // Find header row - look for "Name" column
  let headerIdx = 0;
  let headers = [];
  for (let i = 0; i < Math.min(5, lines.length); i++) {
    const cols = splitCSVLine(lines[i]);
    if (cols.some(c => c.trim().toLowerCase() === 'name')) {
      headerIdx = i;
      headers = cols.map(c => c.trim().toLowerCase());
      break;
    }
  }

  const nameIdx = headers.indexOf('name');
  const binderNameIdx = headers.indexOf('binder name');
  const binderTypeIdx = headers.indexOf('binder type');

  if (nameIdx === -1) {
    alert('Could not find a "Name" column in your CSV. Please check the file.');
    return [];
  }

  const rows = [];
  for (let i = headerIdx + 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cols = splitCSVLine(line);
    const name = (cols[nameIdx] || '').trim();
    if (!name) continue;

    rows.push({
      name: name,
      binderName: binderNameIdx >= 0 ? (cols[binderNameIdx] || '').trim() : '',
      binderType: binderTypeIdx >= 0 ? (cols[binderTypeIdx] || '').trim().toLowerCase() : ''
    });
  }
  return rows;
}

function splitCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += ch;
    }
  }
  result.push(current);
  return result;
}

// --- Target List Parser ---
// Strips: leading qty (1 / 4x), set code (SNC), collector number (46), trailing junk
function parseTargetLine(line) {
  let s = line.trim();
  if (!s) return null;

  // Remove leading quantity: "1 ", "4x ", "4X "
  s = s.replace(/^\d+[xX]?\s+/, '');

  // Remove trailing set code + collector number: "(M20) 46" or "(M20)"
  s = s.replace(/\s*\([^)]+\)\s*\d*\s*$/, '');

  // Remove trailing standalone numbers
  s = s.replace(/\s+\d+\s*$/, '');

  // Remove foil markers, rarity, etc.
  s = s.replace(/\s*\*[^*]*\*\s*/g, '');
  s = s.replace(/\s+(foil|nonfoil|etched|borderless|showcase|extended art)\s*/gi, '');

  return s.trim() || null;
}

// --- Normalize for comparison ---
function normalize(name) {
  return name.toLowerCase()
    .replace(/['']/g, "'")
    .replace(/[^\w\s,'-]/g, '')
    .trim();
}

// --- Main comparison ---
async function runComparison() {
  console.log('runComparison fired, collection rows:', collectionData.length);
  try {
  if (collectionData.length === 0) {
    alert('Please upload your ManaBox CSV first.');
    return;
  }

  const rawTarget = document.getElementById('targetList').value;
  console.log('Target textarea length:', rawTarget.length);
  const targetLines = rawTarget.split('\n').map(parseTargetLine).filter(Boolean);
  console.log('Parsed target lines:', targetLines.length, targetLines.slice(0,3));

  if (targetLines.length === 0) {
    alert('Please paste a target card list.');
    return;
  }

  document.getElementById('compareBtn').disabled = true;
  document.getElementById('compareBtn').textContent = '⏳ Comparing...';

  // Build collection lookup: normalized name -> [{binderName, binderType}]
  const collectionMap = {};
  for (const row of collectionData) {
    const key = normalize(row.name);
    if (!collectionMap[key]) collectionMap[key] = [];
    collectionMap[key].push(row);
  }

  // Compare
  const inDeck = [];    // {name, locations: [{deck: true, label}]}
  const inBinder = [];
  const missing = [];

  for (const cardName of targetLines) {
    const key = normalize(cardName);
    const matches = collectionMap[key] || [];

    if (matches.length === 0) {
      missing.push(cardName);
      continue;
    }

    // Separate deck vs non-deck occurrences
    const deckRows = matches.filter(r => r.binderType === 'deck');
    const nonDeckRows = matches.filter(r => r.binderType !== 'deck');

    const deckLabels = [...new Set(deckRows.map(r => r.binderName).filter(Boolean))];
    const binderLabels = [...new Set(nonDeckRows.map(r => r.binderName).filter(Boolean))];

    if (deckRows.length > 0) {
      inDeck.push({ name: cardName, deckLabels, binderLabels });
    }
    if (nonDeckRows.length > 0) {
      // Only add to binder section if not already captured as deck-only
      inBinder.push({ name: cardName, deckLabels, binderLabels });
    }
  }

  console.log('inDeck:', inDeck.length, 'inBinder:', inBinder.length, 'missing:', missing.length);

  // Unique card names that appear in each section
  const deckNames = [...new Set(inDeck.map(c => c.name))];
  const binderNames = [...new Set(inBinder.map(c => c.name))];

  // Update stats
  document.getElementById('statTotal').textContent = targetLines.length;
  document.getElementById('statDeck').textContent = deckNames.length;
  document.getElementById('statBinder').textContent = binderNames.length;
  document.getElementById('statMissing').textContent = missing.length;
  document.getElementById('deckBadge').textContent = deckNames.length;
  document.getElementById('binderBadge').textContent = binderNames.length;
  document.getElementById('missingBadge').textContent = missing.length;

  // Render grids
  renderCardGrid('deckGrid', inDeck, 'deck');
  renderCardGrid('binderGrid', inBinder, 'binder');
  renderMissingGrid('missingGrid', missing);

  // Toggle sections
  document.getElementById('deckSection').style.display = deckNames.length > 0 ? '' : 'none';
  document.getElementById('binderSection').style.display = binderNames.length > 0 ? '' : 'none';

  const resultsEl = document.getElementById('results');
  resultsEl.style.setProperty('visibility', 'visible', 'important');
  resultsEl.style.setProperty('min-height', 'auto', 'important');
  resultsEl.scrollIntoView({ behavior: 'smooth' });
  document.getElementById('compareBtn').disabled = false;
  document.getElementById('compareBtn').textContent = '⚔ Compare Collection';

  // Images are loaded inline via img src in renderCardGrid
  console.log('Comparison complete, results shown.');
  } catch(err) {
    console.error('Comparison error:', err);
    alert('Error during comparison: ' + err.message);
    document.getElementById('compareBtn').disabled = false;
    document.getElementById('compareBtn').textContent = '⚔ Compare Collection';
  }
}

// --- Render card grid (placeholders first) ---
function renderCardGrid(containerId, cards, mode) {
  const grid = document.getElementById(containerId);
  grid.innerHTML = '';

  if (cards.length === 0) {
    grid.innerHTML = '<div class="empty">None found.</div>';
    return;
  }

  for (const card of cards) {
    const el = document.createElement('div');
    el.className = 'mtg-card';
    el.dataset.cardname = card.name;

    const tags = [];
    if (mode === 'deck' || card.deckLabels?.length > 0) {
      for (const d of (card.deckLabels || [])) {
        tags.push(`<span class="tag tag-deck">${escHtml(d || 'Deck')}</span>`);
      }
    }
    if (mode === 'binder' || card.binderLabels?.length > 0) {
      for (const b of (card.binderLabels || [])) {
        tags.push(`<span class="tag tag-binder">${escHtml(b || 'Binder')}</span>`);
      }
    }

    const scryfallUrl = `https://api.scryfall.com/cards/named?format=image&version=normal&fuzzy=${encodeURIComponent(card.name)}`;
    el.innerHTML = `
      <div class="img-wrap">
        <img class="card-img" src="${scryfallUrl}" alt="${escHtml(card.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" onload="this.nextElementSibling.style.display='none'">
        <div class="placeholder" style="display:none">
          <span class="symbol">🃏</span>
          <span>${escHtml(card.name)}</span>
        </div>
      </div>
      <div class="card-info">
        <div class="card-name">${escHtml(card.name)}</div>
        <div class="card-tags">${tags.join('')}</div>
      </div>
    `;
    grid.appendChild(el);
  }
}

function renderMissingGrid(containerId, names) {
  const grid = document.getElementById(containerId);
  grid.innerHTML = '';
  if (names.length === 0) {
    grid.innerHTML = '<div class="empty">You have everything on this list! 🎉</div>';
    return;
  }
  for (const name of names) {
    const el = document.createElement('div');
    el.className = 'missing-item';
    el.textContent = name;
    grid.appendChild(el);
  }
}

// --- Scryfall image loading via direct img src (no fetch needed) ---
function fetchScryfallImages(cardNames) {
  console.log('fetchScryfallImages called with', cardNames.length, 'cards');
  for (const name of cardNames) {
    const cards = document.querySelectorAll(`[data-cardname="${CSS.escape(name)}"]`);
    console.log('Looking for:', name, '- found elements:', cards.length);
    for (const card of cards) {
      const wrap = card.querySelector('.img-wrap');
      if (!wrap) continue;
      const img = document.createElement('img');
      img.alt = name;
      img.loading = 'lazy';
      img.src = `https://api.scryfall.com/cards/named?format=image&version=normal&fuzzy=${encodeURIComponent(name)}`;
      img.onload = () => {
        wrap.querySelector('.placeholder')?.remove();
        wrap.appendChild(img);
      };
      img.onerror = () => {
        console.log('Scryfall failed for:', name);
      };
    }
  }
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
